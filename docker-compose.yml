services:
  db:
    image: mysql:8.0
    container_name: nccu_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nccu_db
      MYSQL_USER: nccu_user
      MYSQL_PASSWORD: nccu_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nccu_network

  web:
    build: .
    container_name: nccu_web_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql+pymysql://nccu_user:nccu_password@db:3306/nccu_db"
      SECRET_KEY: "dev-secret-key"
    depends_on:
      - db
    networks:
      - nccu_network

volumes:
  mysql_data:

networks:
  nccu_network:
    driver: bridge
